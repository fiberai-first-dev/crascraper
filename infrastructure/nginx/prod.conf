# Host nginx for production. Docker Compose publishes:
#   frontend 127.0.0.1:8080
#   backend  127.0.0.1:4001
#
#   sudo cp infrastructure/nginx/prod.conf /etc/nginx/sites-available/crascraper
#   sudo ln -sf /etc/nginx/sites-available/crascraper /etc/nginx/sites-enabled/crascraper
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (both hostnames):
#   sudo certbot --nginx -d insta-demo.fybud.com -d api.insta-demo.fybud.com

server {
    listen 80;
    listen [::]:80;
    server_name insta-demo.fybud.com;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.insta-demo.fybud.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }
}
