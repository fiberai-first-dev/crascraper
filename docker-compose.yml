x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crafter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crafter}
      POSTGRES_DB: ${POSTGRES_DB:-crafter}
    ports:
      - "${BIND:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crafter} -d ${POSTGRES_DB:-crafter}"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    init: true
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    mem_limit: 400m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-crafter}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-crafter}
    ports:
      - "${BIND:-127.0.0.1}:${RABBITMQ_PORT:-5672}:5672"
      - "${BIND:-127.0.0.1}:${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    stop_grace_period: 15s
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-crafter}:${POSTGRES_PASSWORD:-crafter}@postgres:5432/${POSTGRES_DB:-crafter}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-crafter}:${RABBITMQ_PASSWORD:-crafter}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env to a random 32+ character string}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081,http://localhost:8080,http://localhost:5173,http://insta-demo.fybud.com,https://insta-demo.fybud.com}
      TARGET_QUALIFIED: ${TARGET_QUALIFIED:-100}
    ports:
      - "${BIND:-127.0.0.1}:${BACKEND_PORT:-4001}:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Scale: docker compose up -d --scale crawler=3
  crawler:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    env_file:
      - path: ./crawler/.env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-crafter}:${POSTGRES_PASSWORD:-crafter}@postgres:5432/${POSTGRES_DB:-crafter}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-crafter}:${RABBITMQ_PASSWORD:-crafter}@rabbitmq:5672
      COLLECTOR_MODE: public
      TARGET_QUALIFIED: ${TARGET_QUALIFIED:-100}
      MAX_FOLLOWING_CANDIDATES: "80"
      MAX_FOLLOWER_CANDIDATES: "40"
      MAX_CANDIDATES: "5000"
      DISCOVER_BATCH_SIZE: "20"
      MIN_FOLLOWERS: "1000"
      MAX_POST_ENRICH_BATCH: "12"
    deploy:
      replicas: ${CRAWLER_REPLICAS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    init: true
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    ports:
      - "${BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      backend:
        condition: service_healthy

  # Local edge proxy: http://localhost:8081 (same-origin /api).
  # Production uses host nginx on 80/443; this stays on 8081 and does not conflict.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    init: true
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    ports:
      - "${BIND:-127.0.0.1}:${EDGE_PORT:-8081}:80"
    volumes:
      - ./infrastructure/docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
