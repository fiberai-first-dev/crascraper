services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crafter
      POSTGRES_PASSWORD: crafter
      POSTGRES_DB: crafter
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crafter -d crafter"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: crafter
      RABBITMQ_DEFAULT_PASS: crafter
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://crafter:crafter@postgres:5432/crafter
      RABBITMQ_URL: amqp://crafter:crafter@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081,http://localhost:5173,http://localhost:8080}
      TARGET_QUALIFIED: "100"
    ports:
      - "4001:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Scale: docker compose up -d --scale crawler=3
  # or set CRAWLER_REPLICAS (Compose uses deploy.replicas when supported).
  crawler:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./crawler/.env
    environment:
      DATABASE_URL: postgres://crafter:crafter@postgres:5432/crafter
      RABBITMQ_URL: amqp://crafter:crafter@rabbitmq:5672
      COLLECTOR_MODE: public
      TARGET_QUALIFIED: "100"
      MAX_FOLLOWING_CANDIDATES: "80"
      MAX_FOLLOWER_CANDIDATES: "40"
      MAX_CANDIDATES: "5000"
      DISCOVER_BATCH_SIZE: "20"
      MIN_FOLLOWERS: "1000"
      MAX_POST_ENRICH_BATCH: "12"
    deploy:
      replicas: ${CRAWLER_REPLICAS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ""
      VITE_API_PROXY: http://backend:4000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./infrastructure/docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  rabbitmq_data:
